# Despliegue de U-Medical en UN servidor: MySQL + API (Spring Boot) + web (Angular) con HTTPS automatico (Caddy).
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
# Solo el servicio "web" publica puertos (80 y 443). MySQL y la API quedan dentro de la red de Docker.
name: umedical

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD en el archivo .env}
      MYSQL_DATABASE: u_medical
      MYSQL_USER: umedical
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
    # Ajustes para un servidor pequeno (2 GB de RAM)
    command:
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=60
      - --character-set-server=utf8mb4
    volumes:
      - db_data:/var/lib/mysql
      # Estos scripts corren en orden y solo la PRIMERA vez (volumen vacio): esquema, ajustes de los bloques 5 y 7, datos de ejemplo y permisos.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deploy/mysql-init/02-bloques-5-7.sql:/docker-entrypoint-initdb.d/02-bloques-5-7.sql:ro
      - ./database/seed-secretaria.sql:/docker-entrypoint-initdb.d/03-seed-secretaria.sql:ro
      - ./database/seed-citas-pasadas.sql:/docker-entrypoint-initdb.d/04-seed-citas-pasadas.sql:ro
      - ./deploy/mysql-init/05-grants.sql:/docker-entrypoint-initdb.d/05-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: u_medical
      DB_USER: umedical
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-America/Guatemala}
      UPLOADS_DIR: /data/uploads
      # Detras del proxy: usar la IP real del visitante (limite de intentos) y el esquema https
      FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m -XX:+UseSerialGC"
    volumes:
      - uploads_data:/data/uploads

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en el archivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data      # certificados HTTPS: no borrar (Let's Encrypt limita las emisiones)
      - caddy_config:/config

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
