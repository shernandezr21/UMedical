services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
    volumes:
      - db_data:/var/lib/mysql
      # Estos scripts corren solo la PRIMERA vez (volumen vacio). Para reiniciar la base: docker compose down -v
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Opcional: citas pasadas de prueba para el historial
      # - ./database/seed-citas-pasadas.sql:/docker-entrypoint-initdb.d/02-seed-citas-pasadas.sql:ro
    ports:
      - "3307:3306"   # 3307 en tu equipo para no chocar con un MySQL local en 3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: on-failure   # si arranca antes de que la base termine de inicializar, reintenta
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env              # DB_PASSWORD, JWT_SECRET y, si quieres, CORS_ALLOWED_ORIGINS / CLINIC_TIMEZONE
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: u_medical
      DB_USER: root
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "8080:8080"

volumes:
  db_data:
  uploads_data: