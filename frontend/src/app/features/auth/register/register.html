<div class="login-screen">
  <aside class="login-screen__brand">
    <div class="login-screen__brand-content">
      <h1 class="login-screen__wordmark">U-Medical</h1>
      <p class="login-screen__tagline">
        Crea tu cuenta para agendar citas, ver tu historial y consultar tus diagnosticos y recetas.
      </p>
    </div>
  </aside>

  <main class="login-screen__form-panel">
    <form class="login-form" style="max-width: 460px;" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h2 class="login-form__title">Crear cuenta de paciente</h2>
      <p class="login-form__subtitle">Los campos con * son obligatorios.</p>

      @if (errorMessage()) {
        <div class="login-form__error">{{ errorMessage() }}</div>
      }

      <label class="field" [class.field--error]="errorText('username')">
        <span>Usuario *</span>
        <input type="text" formControlName="username" autocomplete="username" />
        @if (errorText('username'); as msg) { <p class="field__hint">{{ msg }}</p> }
      </label>

      <label class="field" [class.field--error]="errorText('email')">
        <span>Correo electronico *</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (errorText('email'); as msg) { <p class="field__hint">{{ msg }}</p> }
      </label>

      <div class="field-row">
        <label class="field" [class.field--error]="errorText('firstName')">
          <span>Nombre *</span>
          <input type="text" formControlName="firstName" />
          @if (errorText('firstName'); as msg) { <p class="field__hint">{{ msg }}</p> }
        </label>
        <label class="field" [class.field--error]="errorText('lastName')">
          <span>Apellido *</span>
          <input type="text" formControlName="lastName" />
          @if (errorText('lastName'); as msg) { <p class="field__hint">{{ msg }}</p> }
        </label>
      </div>

      <div class="field-row">
        <label class="field" [class.field--error]="errorText('password')">
          <span>Contrasena * (minimo 8 caracteres)</span>
          <input type="password" formControlName="password" autocomplete="new-password" />
          @if (errorText('password'); as msg) { <p class="field__hint">{{ msg }}</p> }
        </label>
        <label class="field" [class.field--error]="errorText('confirmPassword') || (form.errors?.['mismatch'] && form.controls.confirmPassword.touched)">
          <span>Repite la contrasena *</span>
          <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
          @if (errorText('confirmPassword'); as msg) { <p class="field__hint">{{ msg }}</p> }
          @if (form.errors?.['mismatch'] && form.controls.confirmPassword.touched) {
            <p class="field__hint">Las contrasenas no coinciden.</p>
          }
        </label>
      </div>

      <div class="field-row">
        <label class="field" [class.field--error]="errorText('phone')">
          <span>Telefono</span>
          <input type="text" formControlName="phone" />
          @if (errorText('phone'); as msg) { <p class="field__hint">{{ msg }}</p> }
        </label>
        <label class="field">
          <span>Fecha de nacimiento</span>
          <input type="date" formControlName="birthDate" [max]="today" />
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Tipo de sangre</span>
          <select formControlName="bloodType">
            <option value="">No especificar</option>
            @for (t of bloodTypes; track t) {
              <option [value]="t">{{ t }}</option>
            }
          </select>
        </label>
        <label class="field" [class.field--error]="errorText('address')">
          <span>Direccion</span>
          <input type="text" formControlName="address" />
          @if (errorText('address'); as msg) { <p class="field__hint">{{ msg }}</p> }
        </label>
      </div>

      @if (captchaSiteKey) {
        <div style="margin-bottom: 1rem;">
          <app-captcha [siteKey]="captchaSiteKey" (tokenChange)="captchaToken.set($event)" />
        </div>
      }

      <button type="submit" class="login-form__submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>

      <p class="login-form__alt">
        ¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesion</a>
      </p>
    </form>
  </main>
</div>
