spring.application.name=u-medical-api

# Secretos locales (password de MySQL, secreto JWT): van en local.properties, que NO se sube a Git.
# Si ese archivo no existe (Docker, produccion) se leen de variables de entorno.
spring.config.import=optional:classpath:/local.properties

# ---- Base de datos ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:u_medical}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo crea database/schema.sql; Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---- CORS ----
# Patrones separados por coma. [*] significa "cualquier puerto".
# El valor por defecto es para desarrollo (localhost, Capacitor y red local); en produccion define CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=http://localhost:4200,http://localhost:8100,capacitor://localhost,http://localhost

# ---- Reglas de agenda ----
app.clinic-timezone=${CLINIC_TIMEZONE:America/Guatemala}
app.appointments.min-cancel-hours=2
app.appointments.min-booking-lead-minutes=60

# ---- Archivos adjuntos ----
app.uploads.dir=${UPLOADS_DIR:uploads/documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ---- Proteccion anti-bots ----
# Limite por IP (en desarrollo puedes poner app.rate-limit.enabled=false en local.properties)
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.register-per-hour=${RATE_LIMIT_REGISTER_PER_HOUR:10}
app.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:20}

# Captcha (Cloudflare Turnstile). Apagado por defecto.
app.captcha.enabled=${CAPTCHA_ENABLED:false}
app.captcha.secret=${CAPTCHA_SECRET:}

# Detras de un proxy o balanceador (nginx, Cloudflare...) usa FORWARD_HEADERS_STRATEGY=framework;
# si no, el limite por IP vera siempre la IP del proxy y trataria a todos los usuarios como uno solo.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}